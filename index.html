
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Zulaaa ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle, #690018, #180008 75%);
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    position: relative;
    z-index: 5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: clamp(28px, 6vw, 55px);
    color: #fff0f3;
    text-shadow: 0 0 20px #ff174f;
    margin-bottom: 20px;
}

.subtitle {
    font-size: 19px;
    color: #ffd6df;
    margin-bottom: 30px;
}

button {
    padding: 15px 30px;
    border: 1px solid #ff9bad;
    border-radius: 30px;
    background: #c90038;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 20px #ff174f;
}

button:hover {
    background: #ff174f;
}

#message {
    display: none;
    margin-top: 25px;
    max-width: 500px;
    font-size: 20px;
    line-height: 1.8;
    color: #ffe1e8;
    animation: appear 1s ease;
}

.rose {
    position: fixed;
    top: -100px;
    pointer-events: none;
    z-index: 2;
    animation: fall linear forwards;
    filter: drop-shadow(0 0 12px #ff174f);
}

@keyframes fall {
    0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    100% {
        transform: translateY(115vh) rotate(360deg);
        opacity: 0.9;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Zulaaa, чамд зориулав ❤️🌹</h1>

    <p class="subtitle">
        Энэ бүх сарнай зөвхөн чамд зориулсан юм.
    </p>

    <button onclick="showMessage()">
        yu hiij bn? ❤️
    </button>

    <div id="message">
        bandi min heleh ug bnuu? ❤️
        <br>
       zza biye bodooroi.
        <br>
        Энэ сарнай бүр чамд зориулагдсан. 🌹
    </div>
</div>

<script>
function makeRose() {
    const rose = document.createElement("div");

    rose.className = "rose";
    rose.innerHTML = "🌹";

    rose.style.left = Math.random() * 100 + "vw";
    rose.style.fontSize = (35 + Math.random() * 75) + "px";
    rose.style.animationDuration = (2 + Math.random() * 3) + "s";

    document.body.appendChild(rose);

    setTimeout(() => {
        rose.remove();
    }, 6000);
}

// Маш олон сарнай тасралтгүй унана
setInterval(makeRose, 45);

// Вэб нээгдэхэд шууд олон сарнай гарна
for (let i = 0; i < 100; i++) {
    setTimeout(makeRose, i * 25);
}

function showMessage() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
